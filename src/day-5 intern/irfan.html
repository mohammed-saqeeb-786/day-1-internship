 <!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Valentine Card</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #ffe6eb;
      font-family: 'Georgia', serif;
    }

    .card {
      width: 320px;
      height: 360px;
      background: #fff0f5;
      border-radius: 30px;
      padding: 25px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.15);
      text-align: center;
    }

    .card h1 {
      margin-top: 20px;
      font-size: 32px;
      color: #c9184a;
    }

    .card p {
      margin-top: 15px;
      font-size: 16px;
      color: #333;
    }

    .heart {
      font-size: 40px;
      margin-top: 20px;
    }

    .btn {
      margin-top: 25px;
      padding: 10px 20px;
      border: none;
      border-radius: 20px;
      background: #ff4d6d;
      color: white;
      font-size: 14px;
      cursor: pointer;
    }

    .btn:hover {
      background: #e63956;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="heart">❤️</div>
    <h1>Happy Valentine’s</h1>
    <p>
      Wishing you smiles, joy,  
      and lots of happiness today 💕
    </p>
    <button class="btn">For You</button>
  </div>

</body>
</html>
